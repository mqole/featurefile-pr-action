name: Check PR for Feature Files

on:
  pull_request:
    branches: [ "main" ]

permissions:
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: files
        uses: Ana06/get-changed-files@a6591c950d92e67595be3ccd71324cef32c4b7ab #v2.1.0

      - name: Generate Feature File summary
        id: feature
        uses: ./
        with:
          modified: ${{ steps.files.outputs.modified }}
          removed: ${{ steps.files.outputs.removed }}
          added: ${{ steps.files.outputs.added }}
          basename: ${{ github.event.pull_request.base.repo.full_name }}
          basesha: ${{ github.event.pull_request.base.sha }}
          headname: ${{ github.event.pull_request.head.repo.full_name }}
          headsha: ${{ github.event.pull_request.head.sha }}
  
  comment:
    name: Leave Comment
    runs-on: ubuntu-latest
    needs: check
    if: needs.jobs.check.steps.feature.outputs.body-found == 'true'
    steps:
      - name: Potentially find comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad #v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Feature File Summary

      - name: Create comment if it doesn't exist
        if: steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 #v5
        with:
          issue-number: ${{ github.event.number }}
          body: |
            ${{ steps.feature.outputs.summary }}

      - name: Update comment if it exists
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 #v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ${{ steps.feature.outputs.summary }}

      - name: Update comment to read that it has been edited
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 #v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: append
          body: |
            Edit: updated after ${{ github.event.pull_request.head.sha }}